server {
  listen 80;
  server_name _;
  client_max_body_size 250m;

  root /usr/share/nginx/html;
  index index.html;

  # Never cache index.html so hashed assets are picked up on rebuild
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets (JS/CSS) can be cached long-term since the filename changes on rebuild
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
